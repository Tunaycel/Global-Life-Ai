name: Task gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, assigned, unassigned]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: task-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Task gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Re-read the PR: an `edited` event can carry a stale body.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            const author = pr.user.login.toLowerCase();
            const body = pr.body ?? "";
            const problems = [];

            const branch = pr.head.ref.match(/^([A-Za-z0-9-]+)\/(\d+)-[a-z0-9-]+$/);
            if (!branch) {
              problems.push(`Branch \`${pr.head.ref}\` must be \`<user>/<issue-number>-<short-name>\`.`);
            }

            const closes = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)].map((m) => Number(m[1]));
            if (closes.length === 0) {
              problems.push("The description must link its issue with `Closes #N`.");
            } else if (branch && !closes.includes(Number(branch[2]))) {
              problems.push(`The branch names issue #${branch[2]} but the description closes ${closes.map((n) => `#${n}`).join(", ")}.`);
            }

            for (const number of closes) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch {
                problems.push(`#${number} does not exist.`);
                continue;
              }
              if (issue.pull_request) { problems.push(`#${number} is a pull request, not an issue.`); continue; }
              if (issue.state !== "open") problems.push(`#${number} is already closed.`);
              const assignees = (issue.assignees ?? []).map((a) => a.login.toLowerCase());
              if (!assignees.includes(author)) problems.push(`#${number} is not assigned to @${pr.user.login}.`);
            }

            const checklist = body.split(/^##\s+Checklist\s*$/im)[1];
            if (checklist === undefined) {
              problems.push("The PR template's `## Checklist` section is missing.");
            } else {
              const section = checklist.split(/^##\s/m)[0];
              const open = section.match(/^\s*[-*]\s+\[ \]\s+(.+)$/gm) ?? [];
              if (open.length) problems.push(`Checklist items not ticked:\n${open.map((l) => `  ${l.trim()}`).join("\n")}`);
            }

            if (problems.length) {
              core.summary.addHeading("Task gate failed", 3).addList(problems);
              await core.summary.write();
              core.setFailed(problems.join("\n"));
            } else {
              await core.summary.addRaw("Task gate passed: branch, linked issue, assignee and checklist are in order.").write();
            }
