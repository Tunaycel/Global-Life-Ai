name: Task gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: task-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Task gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // One rule: the PR closes an open issue that is assigned to its author.
            const { owner, repo } = context.repo;
            // Re-read the PR: an `edited` event can carry a stale body.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            if (pr.user.type === "Bot") {
              await core.summary.addRaw(`Task gate skipped for bot @${pr.user.login}.`).write();
              return;
            }
            const author = pr.user.login.toLowerCase();
            // Hidden comments and code blocks are not part of the description a reviewer reads.
            const body = (pr.body ?? "")
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/^ {0,3}(```|~~~)[\s\S]*?^ {0,3}\1/gm, "");
            const closes = [...new Set(
              [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)\b/gi)].map((m) => Number(m[1])),
            )];

            const problems = [];
            if (!closes.length) problems.push("Link the issue in the description with `Closes #N`.");
            for (const number of closes) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch (error) {
                if (error.status !== 404) throw error;
                problems.push(`#${number} does not exist.`);
                continue;
              }
              if (issue.pull_request) { problems.push(`#${number} is a pull request, not an issue.`); continue; }
              if (issue.state !== "open") problems.push(`#${number} is already closed.`);
              if (!(issue.assignees ?? []).some((a) => a.login.toLowerCase() === author)) {
                problems.push(`#${number} is not assigned to @${pr.user.login}; ask the team lead to assign it.`);
              }
            }

            if (problems.length) {
              problems.push("Fix this, then edit the PR description or re-run the check.");
              core.summary.addHeading("Task gate failed", 3).addList(problems);
              await core.summary.write();
              core.setFailed(problems.join("\n"));
            } else {
              await core.summary.addRaw(`Task gate passed: closes ${closes.map((n) => `#${n}`).join(", ")}, assigned to @${pr.user.login}.`).write();
            }
