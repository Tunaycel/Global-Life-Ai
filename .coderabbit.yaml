# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  # CodeRabbit advises on every PR; the team lead's approval is what gates a merge.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: true
  pre_merge_checks:
    title:
      mode: warning
      requirements: "A short English sentence in the imperative that says what the PR changes, under 72 characters."
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Acceptance criteria met
        mode: warning
        instructions: |
          Find the issue this PR closes ("Closes #N" in the description). List every acceptance
          criterion from that issue. For each one, state pass or fail with the file and line that
          implements it. Pass only if every criterion is implemented by this PR's diff, or the PR
          description explains why a criterion does not apply. Fail if no issue is linked.
      - name: Scope matches the issue
        mode: warning
        instructions: |
          Fail if the diff changes behaviour or files unrelated to the goal of the linked issue,
          for example refactors, dependency bumps or styling changes the issue did not ask for.
          Name each unrelated change.
      - name: Sourced visa facts
        mode: warning
        instructions: |
          Fail if the diff adds or changes a user-facing visa rule, requirement, fee, duration,
          processing time or language level without an official government or embassy source URL
          next to it (a sourceUrl field, a link in the same data entry, or a link rendered with it).
      - name: No secrets or personal data
        mode: warning
        instructions: |
          Fail if the diff contains API keys, tokens, passwords, client secrets, private keys,
          .env values, or personal data such as passport numbers, real names with documents,
          addresses or phone numbers.
      - name: Screenshots for UI changes
        mode: warning
        instructions: |
          If the diff changes anything rendered on screen (files under src/app or src/components,
          or styles), pass only if the PR description contains at least one image. Otherwise pass.
  path_instructions:
    - path: "src/**"
      instructions: |
        Next.js 16 App Router, React 19, TypeScript, NextAuth.
        Flag: routes under /dashboard reachable without a session, secrets or tokens in client code,
        user-facing visa rules, fees or durations without an official source link,
        invented testimonials, logos, user counts or prices, and hardcoded UI text that bypasses src/lib/i18n.ts.
    - path: ".github/**"
      instructions: |
        Workflows must keep least-privilege permissions and must not expose secrets to pull requests from forks.
chat:
  auto_reply: true
